<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The G Cup Tournament</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Initialize Supabase
        const SUPABASE_URL = 'https://fzysighdknwkdevtgczn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6eXNpZ2hka253a2RldnRnY3puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0MDk1MjgsImV4cCI6MjA4NTk4NTUyOH0.XmhgXMboIx1O0ml_NajO8hdHygHM3a2qjqY4IQeERq4';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const TestApp = () => {
            const [status, setStatus] = useState('Testing Supabase...');
            const [connected, setConnected] = useState(false);

            useEffect(() => {
                // Test Supabase connection
                const testConnection = async () => {
                    try {
                        const { data, error } = await supabase
                            .from('tournament_data')
                            .select('*')
                            .limit(1);
                        
                        if (error && error.code === '42P01') {
                            // Table doesn't exist yet - that's OK
                            setStatus('✅ Supabase Connected! (Table needs to be created)');
                            setConnected(true);
                        } else if (error) {
                            setStatus('⚠️ Error: ' + error.message);
                        } else {
                            setStatus('✅ Supabase Connected Successfully!');
                            setConnected(true);
                        }
                    } catch (err) {
                        setStatus('❌ Connection failed: ' + err.message);
                    }
                };

                testConnection();
            }, []);

            return (
                <div style={{
                    minHeight: '100vh',
                    background: 'linear-gradient(135deg, #1f2937 0%, #374151 50%, #111827 100%)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    padding: '20px'
                }}>
                    <div style={{
                        background: 'white',
                        borderRadius: '12px',
                        padding: '40px',
                        maxWidth: '600px',
                        textAlign: 'center',
                        boxShadow: '0 10px 30px rgba(0,0,0,0.3)'
                    }}>
                        <h1 style={{
                            fontSize: '32px',
                            fontWeight: 'bold',
                            color: connected ? '#10b981' : '#f59e0b',
                            marginBottom: '20px'
                        }}>
                            The G Cup Tournament
                        </h1>
                        <p style={{
                            fontSize: '20px',
                            color: connected ? '#059669' : '#d97706',
                            marginBottom: '30px',
                            fontWeight: '600'
                        }}>
                            {status}
                        </p>
                        {connected ? (
                            <div style={{
                                background: '#d1fae5',
                                padding: '20px',
                                borderRadius: '8px',
                                border: '2px solid #10b981'
                            }}>
                                <p style={{ color: '#065f46', fontSize: '18px', marginBottom: '15px' }}>
                                    <strong>Supabase is working!</strong>
                                </p>
                                <p style={{ color: '#065f46', fontSize: '14px' }}>
                                    Ready to add tournament features with real-time sync!
                                </p>
                            </div>
                        ) : (
                            <div style={{
                                background: '#fef3c7',
                                padding: '20px',
                                borderRadius: '8px',
                                border: '2px solid #f59e0b'
                            }}>
                                <p style={{ color: '#92400e', fontSize: '14px' }}>
                                    Testing connection...
                                </p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TestApp />);
    </script>
</body>
</html>
