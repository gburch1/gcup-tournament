<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The G Cup Tournament</title>
</head>
<body>
    <div id="root"></div>

    <!-- Load EVERYTHING in order, waiting for each to complete -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase FIRST -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <!-- React SECOND -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel THIRD -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- OUR CODE LAST -->
    <script type="text/babel">
        console.log("Starting app initialization...");
        console.log("Firebase available:", typeof firebase !== 'undefined');
        console.log("React available:", typeof React !== 'undefined');
        
        if (typeof firebase === 'undefined') {
            document.getElementById('root').innerHTML = '<div style="padding: 40px; text-align: center; color: red; font-size: 20px;">ERROR: Firebase failed to load. Please refresh the page.</div>';
            throw new Error('Firebase not loaded');
        }

        const { useState, useEffect } = React;

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB5UW3GO_y-hVWXLBG6SZWwhf041nvUkEQ",
            authDomain: "thegcup-gthang.firebaseapp.com",
            databaseURL: "https://thegcup-gthang-default-rtdb.firebaseio.com",
            projectId: "thegcup-gthang",
            storageBucket: "thegcup-gthang.firebasestorage.app",
            messagingSenderId: "36937413793",
            appId: "1:36937413793:web:7764b576b4b0ac7da5ece0"
        };

        // Initialize Firebase
        console.log("Initializing Firebase...");
        let database;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
                console.log("Firebase initialized successfully");
            }
            database = firebase.database();
            console.log("Database reference created");
        } catch (error) {
            console.error("Firebase initialization error:", error);
            document.getElementById('root').innerHTML = '<div style="padding: 40px; text-align: center;"><h2 style="color: red;">Firebase Error</h2><p>' + error.message + '</p><button onclick="location.reload()" style="padding: 10px 20px; background: blue; color: white; border: none; border-radius: 5px; cursor: pointer;">Retry</button></div>';
            throw error;
        }

        const App = () => {
            const [status, setStatus] = useState('Testing Firebase connection...');
            const [connected, setConnected] = useState(false);

            useEffect(() => {
                // Test Firebase connection
                const testRef = database.ref('.info/connected');
                testRef.on('value', (snapshot) => {
                    if (snapshot.val() === true) {
                        setConnected(true);
                        setStatus('✅ Firebase Connected Successfully!');
                        console.log("Firebase connection successful!");
                    } else {
                        setStatus('⚠️ No internet connection detected');
                    }
                });

                return () => testRef.off();
            }, []);

            return (
                <div style={{
                    minHeight: '100vh',
                    background: 'linear-gradient(135deg, #1f2937 0%, #374151 50%, #111827 100%)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    padding: '20px'
                }}>
                    <div style={{
                        background: 'white',
                        borderRadius: '12px',
                        padding: '40px',
                        maxWidth: '600px',
                        textAlign: 'center',
                        boxShadow: '0 10px 30px rgba(0,0,0,0.3)'
                    }}>
                        <h1 style={{
                            fontSize: '32px',
                            fontWeight: 'bold',
                            color: connected ? '#10b981' : '#f59e0b',
                            marginBottom: '20px'
                        }}>
                            The G Cup Tournament
                        </h1>
                        <p style={{
                            fontSize: '20px',
                            color: connected ? '#059669' : '#d97706',
                            marginBottom: '30px',
                            fontWeight: '600'
                        }}>
                            {status}
                        </p>
                        {connected ? (
                            <div style={{
                                background: '#d1fae5',
                                padding: '20px',
                                borderRadius: '8px',
                                border: '2px solid #10b981'
                            }}>
                                <p style={{ color: '#065f46', fontSize: '18px', marginBottom: '15px' }}>
                                    <strong>Firebase is working!</strong>
                                </p>
                                <p style={{ color: '#065f46', fontSize: '14px' }}>
                                    The connection test passed. Ready to add full tournament features.
                                </p>
                            </div>
                        ) : (
                            <div style={{
                                background: '#fef3c7',
                                padding: '20px',
                                borderRadius: '8px',
                                border: '2px solid #f59e0b'
                            }}>
                                <p style={{ color: '#92400e', fontSize: '14px' }}>
                                    Waiting for connection...
                                </p>
                            </div>
                        )}
                        <button 
                            onClick={() => window.location.reload()} 
                            style={{
                                marginTop: '20px',
                                padding: '12px 24px',
                                background: '#3b82f6',
                                color: 'white',
                                border: 'none',
                                borderRadius: '8px',
                                fontSize: '16px',
                                fontWeight: '600',
                                cursor: 'pointer'
                            }}
                        >
                            Refresh Page
                        </button>
                    </div>
                </div>
            );
        };

        console.log("Rendering app...");
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        console.log("App rendered");
    </script>
</body>
</html>
