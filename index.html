<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The G Cup Tournament</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root">
        <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #1f2937 0%, #374151 50%, #111827 100%);">
            <div style="color: #fbbf24; font-size: 1.5rem; font-weight: bold;">Loading The G Cup...</div>
        </div>
    </div>

    <!-- Firebase - Load First -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        // Check if Firebase loaded
        if (typeof firebase === 'undefined') {
            document.getElementById('root').innerHTML = '<div style="padding: 20px; color: red;">Error: Firebase failed to load. Please refresh the page.</div>';
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Wait for Firebase to be ready
        if (typeof firebase === 'undefined') {
            throw new Error('Firebase not loaded');
        }

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB5UW3GO_y-hVWXLBG6SZWwhf041nvUkEQ",
            authDomain: "thegcup-gthang.firebaseapp.com",
            databaseURL: "https://thegcup-gthang-default-rtdb.firebaseio.com",
            projectId: "thegcup-gthang",
            storageBucket: "thegcup-gthang.firebasestorage.app",
            messagingSenderId: "36937413793",
            appId: "1:36937413793:web:7764b576b4b0ac7da5ece0"
        };

        // Initialize Firebase
        let database;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            database = firebase.database();
        } catch (error) {
            console.error("Firebase init error:", error);
        }

        const TournamentApp = () => {
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            
            useEffect(() => {
                // Simple test
                setTimeout(() => {
                    if (database) {
                        setLoading(false);
                    } else {
                        setError("Database connection failed");
                        setLoading(false);
                    }
                }, 1000);
            }, []);

            if (loading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-gray-800 via-gray-700 to-gray-900 flex items-center justify-center">
                        <div className="text-yellow-400 text-2xl font-bold">Connecting to tournament...</div>
                    </div>
                );
            }

            if (error) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-gray-800 via-gray-700 to-gray-900 flex items-center justify-center p-4">
                        <div className="bg-red-900 text-white p-8 rounded-lg max-w-md text-center">
                            <h2 className="text-2xl font-bold mb-4">Connection Error</h2>
                            <p className="mb-4">{error}</p>
                            <button 
                                onClick={() => window.location.reload()} 
                                className="px-6 py-3 bg-white text-red-900 rounded-lg font-bold hover:bg-gray-100"
                            >
                                Retry
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-800 via-gray-700 to-gray-900 p-4">
                    <div className="max-w-7xl mx-auto">
                        <div className="bg-gradient-to-r from-gray-900 to-gray-800 rounded-lg shadow-2xl p-6 mb-6 border-2 border-yellow-500">
                            <h1 className="text-3xl font-bold text-yellow-400 text-center">
                                🎾 The G Cup Tournament 🎾
                            </h1>
                            <p className="text-yellow-200 text-center italic mt-2">
                                Firebase Connected Successfully!
                            </p>
                        </div>
                        
                        <div className="bg-white rounded-lg p-8 text-center">
                            <p className="text-2xl font-bold text-green-600 mb-4">✅ Connection Test Passed!</p>
                            <p className="text-gray-700">Firebase is working. Ready to add full tournament features.</p>
                        </div>
                    </div>
                </div>
            );
        };

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TournamentApp />);
    </script>
</body>
</html>
