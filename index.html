<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The G Cup Tournament</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.4.0.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const pubnub = new PubNub({
            publishKey: 'pub-c-01bceab5-59ce-4539-ac99-89c988e3e827',
            subscribeKey: 'sub-c-6a5cb217-76f6-46b3-a90b-03e57fed8fd5',
            userId: 'user-' + Math.random().toString(36).substr(2, 9)
        });

        const CHANNEL = 'gcup-tournament';

        const Trophy = ({ className }) => (<svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>);
        const Users = ({ className }) => (<svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>);
        const Award = ({ className }) => (<svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="8" r="6"></circle><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"></path></svg>);
        const Lock = ({ className }) => (<svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>);
        const Unlock = ({ className }) => (<svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>);

        const App = () => {
            const [isDirector, setIsDirector] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [activeTab, setActiveTab] = useState('championship');
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [showTeamManagement, setShowTeamManagement] = useState(false);
            const [showCheckIn, setShowCheckIn] = useState(false);
            const [editingDivision, setEditingDivision] = useState('championship');
            const [loading, setLoading] = useState(true);

            const initialData = {
                championship: {
                    teams: [
                        { id: 1, name: 'Team Alpha', points: 0, players: [
                            { name: 'Player 1', checkedIn: false },
                            { name: 'Player 2', checkedIn: false },
                            { name: 'Player 3', checkedIn: false },
                            { name: 'Player 4', checkedIn: false },
                            { name: 'Player 5', checkedIn: false },
                            { name: 'Player 6', checkedIn: false }
                        ]},
                        { id: 2, name: 'Team Beta', points: 0, players: [
                            { name: 'Player 7', checkedIn: false },
                            { name: 'Player 8', checkedIn: false },
                            { name: 'Player 9', checkedIn: false },
                            { name: 'Player 10', checkedIn: false },
                            { name: 'Player 11', checkedIn: false },
                            { name: 'Player 12', checkedIn: false }
                        ]},
                        { id: 3, name: 'Team Gamma', points: 0, players: [
                            { name: 'Player 13', checkedIn: false },
                            { name: 'Player 14', checkedIn: false },
                            { name: 'Player 15', checkedIn: false },
                            { name: 'Player 16', checkedIn: false },
                            { name: 'Player 17', checkedIn: false },
                            { name: 'Player 18', checkedIn: false }
                        ]},
                        { id: 4, name: 'Team Delta', points: 0, players: [
                            { name: 'Player 19', checkedIn: false },
                            { name: 'Player 20', checkedIn: false },
                            { name: 'Player 21', checkedIn: false },
                            { name: 'Player 22', checkedIn: false },
                            { name: 'Player 23', checkedIn: false },
                            { name: 'Player 24', checkedIn: false }
                        ]}
                    ],
                    rounds: [
                        { id: 1, name: 'Round 1', pointValue: 1, matches: [] },
                        { id: 2, name: 'Round 2', pointValue: 1, matches: [] },
                        { id: 3, name: 'Round 3', pointValue: 2, matches: [] },
                        { id: 4, name: 'Round 4', pointValue: 2, matches: [] }
                    ]
                },
                classic: {
                    teams: [
                        { id: 1, name: 'Team Classic A', points: 0, players: [
                            { name: 'Player A1', checkedIn: false },
                            { name: 'Player A2', checkedIn: false },
                            { name: 'Player A3', checkedIn: false },
                            { name: 'Player A4', checkedIn: false },
                            { name: 'Player A5', checkedIn: false },
                            { name: 'Player A6', checkedIn: false }
                        ]},
                        { id: 2, name: 'Team Classic B', points: 0, players: [
                            { name: 'Player B1', checkedIn: false },
                            { name: 'Player B2', checkedIn: false },
                            { name: 'Player B3', checkedIn: false },
                            { name: 'Player B4', checkedIn: false },
                            { name: 'Player B5', checkedIn: false },
                            { name: 'Player B6', checkedIn: false }
                        ]}
                    ],
                    rounds: [
                        { id: 1, name: 'Round 1', pointValue: 1, matches: [] },
                        { id: 2, name: 'Round 2', pointValue: 1, matches: [] },
                        { id: 3, name: 'Round 3', pointValue: 2, matches: [] },
                        { id: 4, name: 'Round 4', pointValue: 2, matches: [] }
                    ]
                }
            };

            const [tournamentData, setTournamentData] = useState(initialData);

            useEffect(() => {
                pubnub.subscribe({ channels: [CHANNEL] });

                const listener = {
                    message: (event) => {
                        if (event.message && event.message.data) {
                            setTournamentData(event.message.data);
                        }
                    }
                };

                pubnub.addListener(listener);

                // Try to get current state
                pubnub.history({
                    channel: CHANNEL,
                    count: 1
                }, (status, response) => {
                    if (response && response.messages && response.messages.length > 0) {
                        const lastMessage = response.messages[0].entry;
                        if (lastMessage && lastMessage.data) {
                            setTournamentData(lastMessage.data);
                        }
                    }
                    setLoading(false);
                });

                return () => {
                    pubnub.removeListener(listener);
                    pubnub.unsubscribeAll();
                };
            }, []);

            const publishData = (data) => {
                setTournamentData(data);
                pubnub.publish({
                    channel: CHANNEL,
                    message: { data, timestamp: Date.now() }
                });
            };

            const updateTeamName = (division, teamId, newName) => {
                const updated = {
                    ...tournamentData,
                    [division]: {
                        ...tournamentData[division],
                        teams: tournamentData[division].teams.map(team =>
                            team.id === teamId ? { ...team, name: newName } : team
                        )
                    }
                };
                publishData(updated);
            };

            const updatePlayerName = (division, teamId, playerIndex, newName) => {
                const updated = {
                    ...tournamentData,
                    [division]: {
                        ...tournamentData[division],
                        teams: tournamentData[division].teams.map(team =>
                            team.id === teamId ? {
                                ...team,
                                players: team.players.map((p, idx) => {
                                    if (idx === playerIndex) {
                                        // If it's a string, convert to object
                                        if (typeof p === 'string') {
                                            return { name: newName, checkedIn: false };
                                        }
                                        // If it's already an object, just update the name
                                        return { ...p, name: newName };
                                    }
                                    return p;
                                })
                            } : team
                        )
                    }
                };
                publishData(updated);
            };

            const toggleCheckIn = (division, teamId, playerIndex) => {
                const updated = {
                    ...tournamentData,
                    [division]: {
                        ...tournamentData[division],
                        teams: tournamentData[division].teams.map(team =>
                            team.id === teamId ? {
                                ...team,
                                players: team.players.map((p, idx) => {
                                    if (idx === playerIndex) {
                                        // If it's a string, convert to object
                                        if (typeof p === 'string') {
                                            return { name: p, checkedIn: true };
                                        }
                                        // If it's already an object, toggle checkedIn
                                        return { ...p, checkedIn: !p.checkedIn };
                                    }
                                    return p;
                                })
                            } : team
                        )
                    }
                };
                publishData(updated);
            };

            const addMatch = (division, roundId, team1Id, team2Id) => {
                const newMatch = {
                    id: Date.now(),
                    team1: team1Id,
                    team2: team2Id,
                    team1Player1: '',
                    team1Player2: '',
                    team2Player1: '',
                    team2Player2: '',
                    team1Games: 0,
                    team2Games: 0,
                    tiebreakScore: '',
                    completed: false
                };

                const updated = {
                    ...tournamentData,
                    [division]: {
                        ...tournamentData[division],
                        rounds: tournamentData[division].rounds.map(round =>
                            round.id === roundId
                                ? { ...round, matches: [...round.matches, newMatch] }
                                : round
                        )
                    }
                };
                publishData(updated);
            };

            const updateMatch = (division, roundId, matchId, updates) => {
                const updated = {
                    ...tournamentData,
                    [division]: {
                        ...tournamentData[division],
                        rounds: tournamentData[division].rounds.map(round =>
                            round.id === roundId ? {
                                ...round,
                                matches: round.matches.map(match =>
                                    match.id === matchId ? { ...match, ...updates } : match
                                )
                            } : round
                        )
                    }
                };
                publishData(updated);
            };

            const completeMatch = (division, roundId, matchId) => {
                const round = tournamentData[division].rounds.find(r => r.id === roundId);
                const match = round.matches.find(m => m.id === matchId);
                
                if (!match.team1Player1 || !match.team1Player2 || !match.team2Player1 || !match.team2Player2) {
                    alert('Please select all players');
                    return;
                }

                let winner;
                if (match.team1Games === match.team2Games && match.team1Games === 3) {
                    if (!match.tiebreakScore || !match.tiebreakScore.includes('-')) {
                        alert('Please enter tiebreak score');
                        return;
                    }
                    const tb = match.tiebreakScore.split('-').map(s => parseInt(s.trim()));
                    winner = tb[0] > tb[1] ? match.team1 : match.team2;
                } else {
                    winner = match.team1Games > match.team2Games ? match.team1 : match.team2;
                }

                const updated = {
                    ...tournamentData,
                    [division]: {
                        ...tournamentData[division],
                        teams: tournamentData[division].teams.map(team =>
                            team.id === winner ? { ...team, points: team.points + round.pointValue } : team
                        ),
                        rounds: tournamentData[division].rounds.map(r =>
                            r.id === roundId ? {
                                ...r,
                                matches: r.matches.map(m =>
                                    m.id === matchId ? { ...m, completed: true } : m
                                )
                            } : r
                        )
                    }
                };
                publishData(updated);
            };

            const deleteMatch = (division, roundId, matchId) => {
                const round = tournamentData[division].rounds.find(r => r.id === roundId);
                const match = round.matches.find(m => m.id === matchId);

                let updated;
                if (match.completed) {
                    let winner;
                    if (match.team1Games === match.team2Games && match.team1Games === 3) {
                        const tb = match.tiebreakScore.split('-').map(s => parseInt(s.trim()));
                        winner = tb[0] > tb[1] ? match.team1 : match.team2;
                    } else {
                        winner = match.team1Games > match.team2Games ? match.team1 : match.team2;
                    }

                    updated = {
                        ...tournamentData,
                        [division]: {
                            ...tournamentData[division],
                            teams: tournamentData[division].teams.map(team =>
                                team.id === winner ? { ...team, points: team.points - round.pointValue } : team
                            ),
                            rounds: tournamentData[division].rounds.map(r =>
                                r.id === roundId ? { ...r, matches: r.matches.filter(m => m.id !== matchId) } : r
                            )
                        }
                    };
                } else {
                    updated = {
                        ...tournamentData,
                        [division]: {
                            ...tournamentData[division],
                            rounds: tournamentData[division].rounds.map(r =>
                                r.id === roundId ? { ...r, matches: r.matches.filter(m => m.id !== matchId) } : r
                            )
                        }
                    };
                }
                publishData(updated);
            };

            const getTeamName = (division, teamId) => {
                const team = tournamentData[division].teams.find(t => t.id === teamId);
                return team ? team.name : '';
            };

            const getTeamPlayers = (division, teamId) => {
                const team = tournamentData[division].teams.find(t => t.id === teamId);
                return team ? team.players : [];
            };

            const getTeamsInIncompleteMatches = (division, roundId) => {
                const round = tournamentData[division].rounds.find(r => r.id === roundId);
                if (!round) return [];
                
                const busyTeams = new Set();
                round.matches.forEach(match => {
                    if (!match.completed) {
                        busyTeams.add(match.team1);
                        busyTeams.add(match.team2);
                    }
                });
                return Array.from(busyTeams);
            };

            const isTeamAvailable = (division, roundId, teamId) => {
                const busyTeams = getTeamsInIncompleteMatches(division, roundId);
                return !busyTeams.includes(teamId);
            };

            const matchExists = (division, roundId, team1Id, team2Id) => {
                const round = tournamentData[division].rounds.find(r => r.id === roundId);
                if (!round) return false;
                
                return round.matches.some(match => 
                    (match.team1 === team1Id && match.team2 === team2Id) ||
                    (match.team1 === team2Id && match.team2 === team1Id)
                );
            };

            const getMatchStatus = (match) => {
                if (match.completed) return 'completed';
                if (match.team1Games > 0 || match.team2Games > 0) return 'inProgress';
                return 'notStarted';
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-gray-800 via-gray-700 to-gray-900 flex items-center justify-center">
                        <div className="text-yellow-400 text-2xl font-bold">🔥 Connecting to real-time updates...</div>
                    </div>
                );
            }

            const currentDivision = tournamentData[activeTab];
            const sortedTeams = [...currentDivision.teams].sort((a, b) => b.points - a.points);

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-800 via-gray-700 to-gray-900 p-4">
                    <div className="max-w-7xl mx-auto">
                        {/* Header - continuing in next message due to length */}
                        <div className="bg-gradient-to-r from-gray-900 to-gray-800 rounded-lg shadow-2xl p-6 mb-6 border-2 border-yellow-500">
                            <div className="flex items-center justify-between flex-wrap gap-4">
                                <div className="flex items-center gap-3">
                                    <Trophy className="w-10 h-10 text-yellow-400" />
                                    <div>
                                        <h1 className="text-3xl font-bold text-yellow-400">The G Cup Tournament</h1>
                                        <p className="text-yellow-200 italic">🔥 Real-Time Updates Active</p>
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    {isDirector && (
                                        <>
                                            <button onClick={() => setShowCheckIn(true)} className="flex items-center gap-2 px-4 py-2 rounded-lg font-semibold bg-gradient-to-r from-green-500 to-green-600 text-white hover:from-green-400 hover:to-green-500 shadow-lg">
                                                ✓ Check-In
                                            </button>
                                            <button onClick={() => setShowTeamManagement(true)} className="flex items-center gap-2 px-4 py-2 rounded-lg font-semibold bg-gradient-to-r from-yellow-500 to-yellow-600 text-gray-900 hover:from-yellow-400 hover:to-yellow-500 shadow-lg">
                                                <Users className="w-5 h-5" />Manage Teams
                                            </button>
                                        </>
                                    )}
                                    <button onClick={() => isDirector ? setIsDirector(false) : setShowPasswordModal(true)} className={`flex items-center gap-2 px-4 py-2 rounded-lg font-semibold shadow-lg ${isDirector ? 'bg-gradient-to-r from-red-600 to-red-700 text-white' : 'bg-gradient-to-r from-yellow-500 to-yellow-600 text-gray-900'}`}>
                                        {isDirector ? <Unlock className="w-5 h-5" /> : <Lock className="w-5 h-5" />}
                                        {isDirector ? 'Logout' : 'Director Login'}
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div className="flex gap-4 mb-6">
                            <button onClick={() => setActiveTab('championship')} className={`flex-1 py-3 px-6 rounded-lg font-semibold shadow-lg ${activeTab === 'championship' ? 'bg-gradient-to-r from-yellow-500 to-yellow-600 text-gray-900 border-2 border-yellow-400' : 'bg-gray-800 text-yellow-200 hover:bg-gray-700 border-2 border-gray-600'}`}>
                                <Award className="w-5 h-5 inline mr-2" />Championship Cup
                            </button>
                            <button onClick={() => setActiveTab('classic')} className={`flex-1 py-3 px-6 rounded-lg font-semibold shadow-lg ${activeTab === 'classic' ? 'bg-gradient-to-r from-yellow-500 to-yellow-600 text-gray-900 border-2 border-yellow-400' : 'bg-gray-800 text-yellow-200 hover:bg-gray-700 border-2 border-gray-600'}`}>
                                <Users className="w-5 h-5 inline mr-2" />Classic Cup
                            </button>
                        </div>

                        <div className="bg-gradient-to-br from-gray-900 to-gray-800 rounded-lg shadow-2xl p-6 mb-6 border-2 border-yellow-500">
                            <h2 className="text-2xl font-bold text-yellow-400 mb-4">Standings</h2>
                            <div className="space-y-3">
                                {sortedTeams.map((team, index) => (
                                    <div key={team.id} className={`p-4 rounded-lg ${index === 0 ? 'bg-gradient-to-r from-yellow-600 to-yellow-500 border-2 border-yellow-400' : 'bg-gray-800 border-2 border-gray-600'}`}>
                                        <div className="flex items-center justify-between">
                                            <div className="flex items-center gap-4">
                                                <span className={`text-2xl font-bold ${index === 0 ? 'text-gray-900' : 'text-yellow-400'}`}>#{index + 1}</span>
                                                <div>
                                                    <h3 className={`text-xl font-bold ${index === 0 ? 'text-gray-900' : 'text-yellow-200'}`}>{team.name}</h3>
                                                    <p className={`text-sm ${index === 0 ? 'text-gray-800' : 'text-gray-400'}`}>
                                                        {team.players.map((p, i) => {
                                                            const playerName = typeof p === 'string' ? p : p.name;
                                                            const isCheckedIn = typeof p === 'object' ? p.checkedIn : false;
                                                            return (
                                                                <span key={i}>
                                                                    {playerName}
                                                                    {isCheckedIn && <span className="text-green-500">✓</span>}
                                                                    {i < team.players.length - 1 ? ', ' : ''}
                                                                </span>
                                                            );
                                                        })}
                                                    </p>
                                                </div>
                                            </div>
                                            <div className={`text-3xl font-bold ${index === 0 ? 'text-gray-900' : 'text-yellow-400'}`}>{team.points} pts</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {currentDivision.rounds.map(round => (
                            <div key={round.id} className="bg-gradient-to-br from-gray-900 to-gray-800 rounded-lg shadow-2xl p-6 mb-6 border-2 border-yellow-500">
                                <div className="flex items-center justify-between mb-4">
                                    <div>
                                        <h2 className="text-2xl font-bold text-yellow-400">{round.name}</h2>
                                        <p className="text-yellow-200">Point Value: {round.pointValue} {round.pointValue === 1 ? 'point' : 'points'}</p>
                                        {round.matches.length > 0 && (
                                            <div className="mt-2 flex items-center gap-4 text-sm flex-wrap">
                                                <span className="text-green-400 font-semibold">
                                                    ✓ {round.matches.filter(m => m.completed).length} Complete
                                                </span>
                                                <span className="text-orange-400 font-semibold">
                                                    🎾 {round.matches.filter(m => !m.completed && (m.team1Games > 0 || m.team2Games > 0)).length} In Progress
                                                </span>
                                                <span className="text-gray-400 font-semibold">
                                                    ⏳ {round.matches.filter(m => !m.completed && m.team1Games === 0 && m.team2Games === 0).length} Not Started
                                                </span>
                                            </div>
                                        )}
                                    </div>
                                    {isDirector && (
                                        <select onChange={(e) => {
                                            const teams = e.target.value.split('-');
                                            if (teams.length === 2) addMatch(activeTab, round.id, parseInt(teams[0]), parseInt(teams[1]));
                                        }} className="px-4 py-2 border-2 border-yellow-500 bg-gray-800 text-yellow-200 rounded-lg font-semibold" value="">
                                            <option value="">+ Add Match</option>
                                            {currentDivision.teams
                                                .filter(team1 => isTeamAvailable(activeTab, round.id, team1.id))
                                                .map(team1 =>
                                                    currentDivision.teams
                                                        .filter(team2 => 
                                                            team2.id !== team1.id && 
                                                            isTeamAvailable(activeTab, round.id, team2.id) &&
                                                            !matchExists(activeTab, round.id, team1.id, team2.id)
                                                        )
                                                        .map(team2 => (
                                                            <option key={`${team1.id}-${team2.id}`} value={`${team1.id}-${team2.id}`}>{team1.name} vs {team2.name}</option>
                                                        ))
                                                )}
                                        </select>
                                    )}
                                </div>
                                <div className="space-y-4">
                                    {round.matches.length === 0 ? (
                                        <p className="text-gray-400 text-center py-8">No matches scheduled</p>
                                    ) : (
                                        [...round.matches]
                                            .sort((a, b) => {
                                                // Sort order: In Progress > Not Started > Completed
                                                const aStatus = a.completed ? 2 : (a.team1Games > 0 || a.team2Games > 0) ? 0 : 1;
                                                const bStatus = b.completed ? 2 : (b.team1Games > 0 || b.team2Games > 0) ? 0 : 1;
                                                return aStatus - bStatus;
                                            })
                                            .map(match => {
                                                const isInProgress = !match.completed && (match.team1Games > 0 || match.team2Games > 0);
                                                const isNotStarted = !match.completed && match.team1Games === 0 && match.team2Games === 0;
                                                const borderColor = match.completed ? 'border-green-500' : isInProgress ? 'border-orange-500' : 'border-gray-600';
                                                const bgColor = match.completed ? 'bg-gray-700' : isInProgress ? 'bg-gray-800' : 'bg-gray-800';
                                                
                                                return (
                                            <div key={match.id} className={`border-2 rounded-lg p-4 ${bgColor} ${borderColor}`}>
                                                {isInProgress && (
                                                    <div className="mb-2 inline-block px-3 py-1 bg-orange-600 text-white text-xs font-bold rounded">
                                                        🎾 IN PROGRESS
                                                    </div>
                                                )}
                                                {isNotStarted && (
                                                    <div className="mb-2 inline-block px-3 py-1 bg-gray-600 text-gray-200 text-xs font-bold rounded">
                                                        ⏳ NOT STARTED
                                                    </div>
                                                )}
                                                {match.completed && (
                                                    <div className="mb-2 inline-block px-3 py-1 bg-green-600 text-white text-xs font-bold rounded">
                                                        ✓ COMPLETED
                                                    </div>
                                                )}
                                                {(match.team1Games > 0 || match.team2Games > 0) && !match.completed && (
                                                    <div className="mb-3 p-2 bg-orange-900 border border-orange-500 rounded text-orange-200 text-sm">
                                                        🔒 Players locked - Complete this match before starting another
                                                    </div>
                                                )}
                                                {(match.team1Games > 0 || match.team2Games > 0 || match.completed) && (
                                                    <div className="text-center mb-4 pb-4 border-b-2 border-gray-600">
                                                        <p className="text-5xl font-bold text-yellow-400">{match.team1Games} - {match.team2Games}</p>
                                                        {match.tiebreakScore && <p className="text-xl font-semibold text-red-400 mt-2">TB: {match.tiebreakScore}</p>}
                                                    </div>
                                                )}
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div>
                                                        <h3 className="font-bold text-lg text-yellow-400 mb-2">{getTeamName(activeTab, match.team1)}</h3>
                                                        {isDirector && !match.completed ? (
                                                            <div className="space-y-2 mb-2">
                                                                <select 
                                                                    value={match.team1Player1} 
                                                                    onChange={(e) => updateMatch(activeTab, round.id, match.id, { team1Player1: e.target.value })} 
                                                                    disabled={match.team1Games > 0 || match.team2Games > 0}
                                                                    className={`w-full px-3 py-2 border rounded ${match.team1Games > 0 || match.team2Games > 0 ? 'bg-gray-600 text-gray-300 cursor-not-allowed' : 'bg-gray-700 text-yellow-200'}`}>
                                                                    <option value="">Select Player 1</option>
                                                                    {getTeamPlayers(activeTab, match.team1).map((p, i) => {
                                                                        const playerName = typeof p === 'string' ? p : p.name;
                                                                        const isCheckedIn = typeof p === 'object' ? p.checkedIn : false;
                                                                        return <option key={i} value={playerName}>{playerName}{isCheckedIn && ' ✓'}</option>;
                                                                    })}
                                                                </select>
                                                                <select 
                                                                    value={match.team1Player2} 
                                                                    onChange={(e) => updateMatch(activeTab, round.id, match.id, { team1Player2: e.target.value })} 
                                                                    disabled={match.team1Games > 0 || match.team2Games > 0}
                                                                    className={`w-full px-3 py-2 border rounded ${match.team1Games > 0 || match.team2Games > 0 ? 'bg-gray-600 text-gray-300 cursor-not-allowed' : 'bg-gray-700 text-yellow-200'}`}>
                                                                    <option value="">Select Player 2</option>
                                                                    {getTeamPlayers(activeTab, match.team1).map((p, i) => {
                                                                        const playerName = typeof p === 'string' ? p : p.name;
                                                                        const isCheckedIn = typeof p === 'object' ? p.checkedIn : false;
                                                                        return <option key={i} value={playerName}>{playerName}{isCheckedIn && ' ✓'}</option>;
                                                                    })}
                                                                </select>
                                                            </div>
                                                        ) : (
                                                            <p className="text-yellow-200 mb-2">{match.team1Player1} & {match.team1Player2}</p>
                                                        )}
                                                        {isDirector && !match.completed ? (
                                                            <input type="number" min="0" max="4" value={match.team1Games} onChange={(e) => updateMatch(activeTab, round.id, match.id, { team1Games: parseInt(e.target.value) || 0 })} className="w-24 px-3 py-2 border bg-gray-700 text-yellow-400 rounded text-center text-2xl font-bold" />
                                                        ) : (
                                                            <p className="text-4xl font-bold text-yellow-400">{match.team1Games}</p>
                                                        )}
                                                    </div>
                                                    <div>
                                                        <h3 className="font-bold text-lg text-yellow-400 mb-2">{getTeamName(activeTab, match.team2)}</h3>
                                                        {isDirector && !match.completed ? (
                                                            <div className="space-y-2 mb-2">
                                                                <select 
                                                                    value={match.team2Player1} 
                                                                    onChange={(e) => updateMatch(activeTab, round.id, match.id, { team2Player1: e.target.value })} 
                                                                    disabled={match.team1Games > 0 || match.team2Games > 0}
                                                                    className={`w-full px-3 py-2 border rounded ${match.team1Games > 0 || match.team2Games > 0 ? 'bg-gray-600 text-gray-300 cursor-not-allowed' : 'bg-gray-700 text-yellow-200'}`}>
                                                                    <option value="">Select Player 1</option>
                                                                    {getTeamPlayers(activeTab, match.team2).map((p, i) => {
                                                                        const playerName = typeof p === 'string' ? p : p.name;
                                                                        const isCheckedIn = typeof p === 'object' ? p.checkedIn : false;
                                                                        return <option key={i} value={playerName}>{playerName}{isCheckedIn && ' ✓'}</option>;
                                                                    })}
                                                                </select>
                                                                <select 
                                                                    value={match.team2Player2} 
                                                                    onChange={(e) => updateMatch(activeTab, round.id, match.id, { team2Player2: e.target.value })} 
                                                                    disabled={match.team1Games > 0 || match.team2Games > 0}
                                                                    className={`w-full px-3 py-2 border rounded ${match.team1Games > 0 || match.team2Games > 0 ? 'bg-gray-600 text-gray-300 cursor-not-allowed' : 'bg-gray-700 text-yellow-200'}`}>
                                                                    <option value="">Select Player 2</option>
                                                                    {getTeamPlayers(activeTab, match.team2).map((p, i) => {
                                                                        const playerName = typeof p === 'string' ? p : p.name;
                                                                        const isCheckedIn = typeof p === 'object' ? p.checkedIn : false;
                                                                        return <option key={i} value={playerName}>{playerName}{isCheckedIn && ' ✓'}</option>;
                                                                    })}
                                                                </select>
                                                            </div>
                                                        ) : (
                                                            <p className="text-yellow-200 mb-2">{match.team2Player1} & {match.team2Player2}</p>
                                                        )}
                                                        {isDirector && !match.completed ? (
                                                            <input type="number" min="0" max="4" value={match.team2Games} onChange={(e) => updateMatch(activeTab, round.id, match.id, { team2Games: parseInt(e.target.value) || 0 })} className="w-24 px-3 py-2 border bg-gray-700 text-yellow-400 rounded text-center text-2xl font-bold" />
                                                        ) : (
                                                            <p className="text-4xl font-bold text-yellow-400">{match.team2Games}</p>
                                                        )}
                                                    </div>
                                                </div>
                                                {((match.team1Games === 3 && match.team2Games === 3) || match.tiebreakScore) && (
                                                    <div className="mt-4 pt-4 border-t border-gray-600">
                                                        <p className="font-semibold text-yellow-200 mb-2">Tiebreak</p>
                                                        {isDirector && !match.completed ? (
                                                            <input type="text" placeholder="e.g., 7-5" value={match.tiebreakScore} onChange={(e) => updateMatch(activeTab, round.id, match.id, { tiebreakScore: e.target.value })} className="w-32 px-3 py-2 border bg-gray-700 text-yellow-200 rounded" />
                                                        ) : (
                                                            <p className="text-xl font-bold text-red-400">{match.tiebreakScore}</p>
                                                        )}
                                                    </div>
                                                )}
                                                {isDirector && (
                                                    <div className="mt-4 flex gap-2">
                                                        {!match.completed ? (
                                                            <button onClick={() => completeMatch(activeTab, round.id, match.id)} className="px-4 py-2 bg-gradient-to-r from-green-600 to-green-700 text-white rounded-lg hover:from-green-500 hover:to-green-600 font-semibold shadow-lg">Complete Match</button>
                                                        ) : (
                                                            <span className="px-4 py-2 bg-green-600 text-white rounded-lg font-semibold">✓ Completed</span>
                                                        )}
                                                        <button onClick={() => deleteMatch(activeTab, round.id, match.id)} className="px-4 py-2 bg-gradient-to-r from-red-600 to-red-700 text-white rounded-lg hover:from-red-500 hover:to-red-600 font-semibold shadow-lg">Delete</button>
                                                    </div>
                                                )}
                                            </div>
                                                );
                                            })
                                    )}
                                </div>
                            </div>
                        ))}

                        {showPasswordModal && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                                <div className="bg-white rounded-lg p-6 w-96">
                                    <h3 className="text-xl font-bold mb-4">Director Login</h3>
                                    <input type="password" placeholder="Enter password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && (passwordInput === 'director123' ? (setIsDirector(true), setShowPasswordModal(false), setPasswordInput('')) : alert('Incorrect'))} className="w-full px-4 py-2 border rounded mb-4" />
                                    <div className="flex gap-2">
                                        <button onClick={() => passwordInput === 'director123' ? (setIsDirector(true), setShowPasswordModal(false), setPasswordInput('')) : alert('Incorrect')} className="flex-1 px-4 py-2 bg-blue-500 text-white rounded">Login</button>
                                        <button onClick={() => (setShowPasswordModal(false), setPasswordInput(''))} className="flex-1 px-4 py-2 bg-gray-300 rounded">Cancel</button>
                                    </div>
                                    <p className="text-sm text-gray-600 mt-4">Password: director123</p>
                                </div>
                            </div>
                        )}

                        {showTeamManagement && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                                <div className="bg-white rounded-lg p-6 w-full max-w-4xl max-h-[90vh] overflow-y-auto">
                                    <div className="flex items-center justify-between mb-6 sticky top-0 bg-white pb-4 border-b">
                                        <h3 className="text-2xl font-bold">Team Management</h3>
                                        <button onClick={() => setShowTeamManagement(false)} className="px-4 py-2 bg-gray-300 rounded">Close</button>
                                    </div>
                                    <div className="flex gap-4 mb-6">
                                        <button onClick={() => setEditingDivision('championship')} className={`flex-1 py-2 px-4 rounded-lg font-semibold ${editingDivision === 'championship' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>Championship</button>
                                        <button onClick={() => setEditingDivision('classic')} className={`flex-1 py-2 px-4 rounded-lg font-semibold ${editingDivision === 'classic' ? 'bg-green-600 text-white' : 'bg-gray-200'}`}>Classic</button>
                                    </div>
                                    <div className="space-y-6">
                                        {tournamentData[editingDivision].teams.map(team => (
                                            <div key={team.id} className="border-2 rounded-lg p-4">
                                                <div className="mb-4">
                                                    <label className="block text-sm font-semibold mb-2">Team Name</label>
                                                    <input type="text" value={team.name} onChange={(e) => updateTeamName(editingDivision, team.id, e.target.value)} className="w-full px-4 py-2 border-2 border-blue-300 rounded-lg text-lg font-bold" />
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-semibold mb-2">Players</label>
                                                    <div className="space-y-2">
                                                        {team.players.map((player, idx) => {
                                                            const playerName = typeof player === 'string' ? player : player.name;
                                                            return (
                                                                <div key={idx} className="flex items-center gap-2">
                                                                    <span className="w-8">#{idx + 1}</span>
                                                                    <input type="text" value={playerName} onChange={(e) => updatePlayerName(editingDivision, team.id, idx, e.target.value)} className="flex-1 px-3 py-2 border rounded" />
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="mt-6 p-4 bg-green-50 rounded-lg">
                                        <p className="text-sm text-green-800"><strong>🔥 Real-Time:</strong> Changes sync instantly via PubNub!</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {showCheckIn && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                                <div className="bg-white rounded-lg p-6 w-full max-w-4xl max-h-[90vh] overflow-y-auto">
                                    <div className="flex items-center justify-between mb-6 sticky top-0 bg-white pb-4 border-b">
                                        <h3 className="text-2xl font-bold">Player Check-In</h3>
                                        <button onClick={() => setShowCheckIn(false)} className="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Close</button>
                                    </div>
                                    <div className="flex gap-4 mb-6">
                                        <button onClick={() => setEditingDivision('championship')} className={`flex-1 py-2 px-4 rounded-lg font-semibold ${editingDivision === 'championship' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>Championship</button>
                                        <button onClick={() => setEditingDivision('classic')} className={`flex-1 py-2 px-4 rounded-lg font-semibold ${editingDivision === 'classic' ? 'bg-green-600 text-white' : 'bg-gray-200'}`}>Classic</button>
                                    </div>
                                    <div className="space-y-6">
                                        {tournamentData[editingDivision].teams.map(team => (
                                            <div key={team.id} className="border-2 rounded-lg p-4">
                                                <h4 className="text-lg font-bold mb-3 text-blue-600">{team.name}</h4>
                                                <div className="space-y-2">
                                                    {team.players.map((player, idx) => {
                                                        const playerName = typeof player === 'string' ? player : player.name;
                                                        const isCheckedIn = typeof player === 'object' ? player.checkedIn : false;
                                                        return (
                                                            <div key={idx} className="flex items-center gap-3 p-2 hover:bg-gray-50 rounded">
                                                                <input 
                                                                    type="checkbox" 
                                                                    checked={isCheckedIn}
                                                                    onChange={() => toggleCheckIn(editingDivision, team.id, idx)}
                                                                    className="w-5 h-5 cursor-pointer"
                                                                />
                                                                <span className={`flex-1 text-lg ${isCheckedIn ? 'text-green-600 font-semibold' : 'text-gray-700'}`}>
                                                                    {playerName}
                                                                    {isCheckedIn && <span className="ml-2">✓</span>}
                                                                </span>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                                <div className="mt-3 pt-3 border-t text-sm text-gray-600">
                                                    Checked in: {team.players.filter(p => typeof p === 'object' && p.checkedIn).length} / {team.players.length}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="mt-6 p-4 bg-green-50 rounded-lg">
                                        <p className="text-sm text-green-800"><strong>✓ Real-Time:</strong> Check-in status syncs instantly across all devices!</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
