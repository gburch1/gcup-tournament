<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The G Cup Tournament</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <!-- PubNub -->
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.4.0.min.js"></script>
    
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Initialize PubNub
        const pubnub = new PubNub({
            publishKey: 'pub-c-01bceab5-59ce-4539-ac99-89c988e3e827',
            subscribeKey: 'sub-c-6a5cb217-76f6-46b3-a90b-03e57fed8fd5',
            userId: 'user-' + Math.random().toString(36).substr(2, 9)
        });

        const CHANNEL = 'gcup-tournament-data';

        const App = () => {
            const [status, setStatus] = useState('Testing PubNub...');
            const [connected, setConnected] = useState(false);

            useEffect(() => {
                // Subscribe to channel
                pubnub.subscribe({ channels: [CHANNEL] });

                // Listen for messages
                const listener = {
                    message: (event) => {
                        console.log('Message received:', event);
                        setStatus('✅ PubNub Connected! Real-time working!');
                        setConnected(true);
                    },
                    status: (statusEvent) => {
                        if (statusEvent.category === 'PNConnectedCategory') {
                            setStatus('✅ PubNub Connected Successfully!');
                            setConnected(true);
                            
                            // Send test message
                            pubnub.publish({
                                channel: CHANNEL,
                                message: { test: 'Connection successful', time: new Date().toISOString() }
                            });
                        }
                    }
                };

                pubnub.addListener(listener);

                return () => {
                    pubnub.removeListener(listener);
                    pubnub.unsubscribeAll();
                };
            }, []);

            return (
                <div style={{
                    minHeight: '100vh',
                    background: 'linear-gradient(135deg, #1f2937 0%, #374151 50%, #111827 100%)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    padding: '20px'
                }}>
                    <div style={{
                        background: 'white',
                        borderRadius: '12px',
                        padding: '40px',
                        maxWidth: '600px',
                        textAlign: 'center',
                        boxShadow: '0 10px 30px rgba(0,0,0,0.3)'
                    }}>
                        <h1 style={{
                            fontSize: '32px',
                            fontWeight: 'bold',
                            color: connected ? '#10b981' : '#f59e0b',
                            marginBottom: '20px'
                        }}>
                            🎾 The G Cup Tournament 🎾
                        </h1>
                        <p style={{
                            fontSize: '20px',
                            color: connected ? '#059669' : '#d97706',
                            marginBottom: '30px',
                            fontWeight: '600'
                        }}>
                            {status}
                        </p>
                        {connected ? (
                            <div style={{
                                background: '#d1fae5',
                                padding: '20px',
                                borderRadius: '8px',
                                border: '2px solid #10b981'
                            }}>
                                <p style={{ color: '#065f46', fontSize: '18px', marginBottom: '15px' }}>
                                    <strong>PubNub is working!</strong>
                                </p>
                                <p style={{ color: '#065f46', fontSize: '14px' }}>
                                    Real-time messaging active. Ready for tournament features!
                                </p>
                            </div>
                        ) : (
                            <div style={{
                                background: '#fef3c7',
                                padding: '20px',
                                borderRadius: '8px',
                                border: '2px solid #f59e0b'
                            }}>
                                <p style={{ color: '#92400e', fontSize: '14px' }}>
                                    Connecting to PubNub...
                                </p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
