<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The G Cup Championship</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.8.2.4.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const PUBNUB_CONFIG = {
            publishKey: 'pub-c-01bceab5-59ce-4539-ac99-89c988e3e827',
            subscribeKey: 'sub-c-6a5cb217-76f6-46b3-a90b-03e57fed8fd5',
            userId: 'user-' + Math.random().toString(36).substr(2, 9)
        };

        const CHANNEL = 'gcup-SCORING-FIX-2026';
        const DIRECTOR_PASSWORD = 'director123';

        function TournamentApp() {
            const [isDirector, setIsDirector] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [activeTab, setActiveTab] = useState('championship');
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [showTeamManagement, setShowTeamManagement] = useState(false);
            const [showCheckIn, setShowCheckIn] = useState(false);
            const [editingDivision, setEditingDivision] = useState('championship');
            const [loading, setLoading] = useState(true);
            const [hideCompletedMatchups, setHideCompletedMatchups] = useState({});
            const [teamFilter, setTeamFilter] = useState({}); // Track team filter per round
            
            const [tournamentData, setTournamentData] = useState({
                championship: {
                    teams: [
                        { id: 1, name: 'Team Alpha', points: 0, players: [{name: 'Player 1', checkedIn: false}, {name: 'Player 2', checkedIn: false}, {name: 'Player 3', checkedIn: false}, {name: 'Player 4', checkedIn: false}, {name: 'Player 5', checkedIn: false}, {name: 'Player 6', checkedIn: false}] },
                        { id: 2, name: 'Team Beta', points: 0, players: [{name: 'Player 1', checkedIn: false}, {name: 'Player 2', checkedIn: false}, {name: 'Player 3', checkedIn: false}, {name: 'Player 4', checkedIn: false}, {name: 'Player 5', checkedIn: false}, {name: 'Player 6', checkedIn: false}] },
                        { id: 3, name: 'Team Gamma', points: 0, players: [{name: 'Player 1', checkedIn: false}, {name: 'Player 2', checkedIn: false}, {name: 'Player 3', checkedIn: false}, {name: 'Player 4', checkedIn: false}, {name: 'Player 5', checkedIn: false}, {name: 'Player 6', checkedIn: false}] },
                        { id: 4, name: 'Team Delta', points: 0, players: [{name: 'Player 1', checkedIn: false}, {name: 'Player 2', checkedIn: false}, {name: 'Player 3', checkedIn: false}, {name: 'Player 4', checkedIn: false}, {name: 'Player 5', checkedIn: false}, {name: 'Player 6', checkedIn: false}] }
                    ],
                    rounds: [
                        { id: 1, name: 'Round 1', pointValue: 1, matchups: [] },
                        { id: 2, name: 'Round 2', pointValue: 1, matchups: [] },
                        { id: 3, name: 'Round 3', pointValue: 2, matchups: [] },
                        { id: 4, name: 'Round 4', pointValue: 2, matchups: [] }
                    ]
                },
                classic: {
                    teams: [
                        { id: 1, name: 'Team Epsilon', points: 0, players: [{name: 'Player 1', checkedIn: false}, {name: 'Player 2', checkedIn: false}, {name: 'Player 3', checkedIn: false}, {name: 'Player 4', checkedIn: false}, {name: 'Player 5', checkedIn: false}, {name: 'Player 6', checkedIn: false}] },
                        { id: 2, name: 'Team Zeta', points: 0, players: [{name: 'Player 1', checkedIn: false}, {name: 'Player 2', checkedIn: false}, {name: 'Player 3', checkedIn: false}, {name: 'Player 4', checkedIn: false}, {name: 'Player 5', checkedIn: false}, {name: 'Player 6', checkedIn: false}] }
                    ],
                    rounds: [
                        { id: 1, name: 'Round 1', pointValue: 1, matchups: [] },
                        { id: 2, name: 'Round 2', pointValue: 1, matchups: [] },
                        { id: 3, name: 'Round 3', pointValue: 2, matchups: [] },
                        { id: 4, name: 'Round 4', pointValue: 2, matchups: [] }
                    ]
                }
            });

            const [pubnub, setPubnub] = useState(null);

            useEffect(() => {
                const pn = new PubNub(PUBNUB_CONFIG);
                setPubnub(pn);

                const listener = {
                    message: (event) => {
                        if (event.channel === CHANNEL && event.message.data) {
                            setTournamentData(event.message.data);
                        }
                    }
                };

                pn.addListener(listener);
                pn.subscribe({ channels: [CHANNEL] });

                pn.history(
                    { channel: CHANNEL, count: 1 },
                    (status, response) => {
                        if (response && response.messages && response.messages.length > 0) {
                            setTournamentData(response.messages[0].entry.data);
                        }
                        setLoading(false);
                    }
                );

                return () => {
                    pn.removeListener(listener);
                    pn.unsubscribeAll();
                };
            }, []);

            const publishData = (data) => {
                if (pubnub) {
                    pubnub.publish(
                        { channel: CHANNEL, message: { data } },
                        (status, response) => {
                            if (status.error) {
                                console.error('Publish error:', status);
                            }
                        }
                    );
                }
            };

            const addTeamMatchup = (division, roundId, team1Id, team2Id) => {
                const newData = { ...tournamentData };
                const round = newData[division].rounds.find(r => r.id === roundId);
                
                const newMatchup = {
                    id: Date.now(),
                    team1: team1Id,
                    team2: team2Id,
                    pairs: [
                        { pairNumber: 1, team1Player1: '', team1Player2: '', team2Player1: '', team2Player2: '', team1Games: 0, team2Games: 0, tiebreakScore: '', completed: false },
                        { pairNumber: 2, team1Player1: '', team1Player2: '', team2Player1: '', team2Player2: '', team1Games: 0, team2Games: 0, tiebreakScore: '', completed: false },
                        { pairNumber: 3, team1Player1: '', team1Player2: '', team2Player1: '', team2Player2: '', team1Games: 0, team2Games: 0, tiebreakScore: '', completed: false }
                    ],
                    allPairsComplete: false
                };
                
                round.matchups.push(newMatchup);
                setTournamentData(newData);
                publishData(newData);
            };

            const updatePair = (division, roundId, matchupId, pairNumber, updates) => {
                const newData = { ...tournamentData };
                const round = newData[division].rounds.find(r => r.id === roundId);
                const matchup = round.matchups.find(m => m.id === matchupId);
                const pair = matchup.pairs.find(l => l.pairNumber === pairNumber);
                
                Object.assign(pair, updates);
                
                setTournamentData(newData);
                publishData(newData);
            };

            const completePair = (division, roundId, matchupId, pairNumber) => {
                const newData = { ...tournamentData };
                const round = newData[division].rounds.find(r => r.id === roundId);
                const matchup = round.matchups.find(m => m.id === matchupId);
                const pair = matchup.pairs.find(l => l.pairNumber === pairNumber);
                
                console.log('Completing pair:', {
                    team1Games: pair.team1Games,
                    team2Games: pair.team2Games,
                    tiebreakScore: pair.tiebreakScore,
                    gamesEqual: pair.team1Games === pair.team2Games
                });
                
                pair.completed = true;
                
                // Determine winner - check tiebreak if games are tied
                let team1Wins = false;
                let team2Wins = false;
                
                if (pair.team1Games > pair.team2Games) {
                    team1Wins = true;
                    console.log('Team 1 wins by games');
                } else if (pair.team2Games > pair.team1Games) {
                    team2Wins = true;
                    console.log('Team 2 wins by games');
                } else if (pair.team1Games === pair.team2Games && pair.tiebreakScore) {
                    // Games are tied, check tiebreak (format: "7-5" or "5-7")
                    console.log('Games tied, checking tiebreak:', pair.tiebreakScore);
                    const tbParts = pair.tiebreakScore.split('-').map(s => parseInt(s.trim()));
                    console.log('Tiebreak parts:', tbParts);
                    if (tbParts.length === 2 && !isNaN(tbParts[0]) && !isNaN(tbParts[1])) {
                        if (tbParts[0] > tbParts[1]) {
                            team1Wins = true;
                            console.log('Team 1 wins by tiebreak');
                        } else if (tbParts[1] > tbParts[0]) {
                            team2Wins = true;
                            console.log('Team 2 wins by tiebreak');
                        }
                    }
                }
                
                console.log('Final result:', { team1Wins, team2Wins, pointValue: round.pointValue });
                
                // Award points to the winner
                if (team1Wins) {
                    const team1 = newData[division].teams.find(t => t.id === matchup.team1);
                    team1.points += round.pointValue;
                    console.log('Awarded', round.pointValue, 'points to', team1.name);
                } else if (team2Wins) {
                    const team2 = newData[division].teams.find(t => t.id === matchup.team2);
                    team2.points += round.pointValue;
                    console.log('Awarded', round.pointValue, 'points to', team2.name);
                }
                
                // Check if all pairs are complete
                if (matchup.pairs.every(l => l.completed)) {
                    matchup.allPairsComplete = true;
                }
                
                setTournamentData(newData);
                publishData(newData);
            };

            const uncomplatePair = (division, roundId, matchupId, pairNumber) => {
                const newData = { ...tournamentData };
                const round = newData[division].rounds.find(r => r.id === roundId);
                const matchup = round.matchups.find(m => m.id === matchupId);
                const pair = matchup.pairs.find(l => l.pairNumber === pairNumber);
                
                // Only uncomplete if it was completed
                if (!pair.completed) return;
                
                // Determine winner to reverse points
                let team1Wins = false;
                let team2Wins = false;
                
                if (pair.team1Games > pair.team2Games) {
                    team1Wins = true;
                } else if (pair.team2Games > pair.team1Games) {
                    team2Wins = true;
                } else if (pair.team1Games === pair.team2Games && pair.tiebreakScore) {
                    // Games are tied, check tiebreak
                    const tbParts = pair.tiebreakScore.split('-').map(s => parseInt(s.trim()));
                    if (tbParts.length === 2 && !isNaN(tbParts[0]) && !isNaN(tbParts[1])) {
                        if (tbParts[0] > tbParts[1]) {
                            team1Wins = true;
                        } else if (tbParts[1] > tbParts[0]) {
                            team2Wins = true;
                        }
                    }
                }
                
                // Reverse the points
                if (team1Wins) {
                    const team1 = newData[division].teams.find(t => t.id === matchup.team1);
                    team1.points -= round.pointValue;
                } else if (team2Wins) {
                    const team2 = newData[division].teams.find(t => t.id === matchup.team2);
                    team2.points -= round.pointValue;
                }
                
                // Mark as not completed
                pair.completed = false;
                matchup.allPairsComplete = false;
                
                setTournamentData(newData);
                publishData(newData);
            };

            const deleteMatchup = (division, roundId, matchupId) => {
                const newData = { ...tournamentData };
                const round = newData[division].rounds.find(r => r.id === roundId);
                const matchup = round.matchups.find(m => m.id === matchupId);
                
                // Reverse points for each completed pair
                matchup.pairs.forEach(pair => {
                    if (pair.completed) {
                        // Determine winner - check tiebreak if games are tied
                        let team1Wins = false;
                        let team2Wins = false;
                        
                        if (pair.team1Games > pair.team2Games) {
                            team1Wins = true;
                        } else if (pair.team2Games > pair.team1Games) {
                            team2Wins = true;
                        } else if (pair.team1Games === pair.team2Games && pair.tiebreakScore) {
                            // Games are tied, check tiebreak
                            const tbParts = pair.tiebreakScore.split('-').map(s => parseInt(s.trim()));
                            if (tbParts.length === 2 && !isNaN(tbParts[0]) && !isNaN(tbParts[1])) {
                                if (tbParts[0] > tbParts[1]) {
                                    team1Wins = true;
                                } else if (tbParts[1] > tbParts[0]) {
                                    team2Wins = true;
                                }
                            }
                        }
                        
                        // Reverse the points
                        if (team1Wins) {
                            const team1 = newData[division].teams.find(t => t.id === matchup.team1);
                            team1.points -= round.pointValue;
                        } else if (team2Wins) {
                            const team2 = newData[division].teams.find(t => t.id === matchup.team2);
                            team2.points -= round.pointValue;
                        }
                    }
                });
                
                round.matchups = round.matchups.filter(m => m.id !== matchupId);
                setTournamentData(newData);
                publishData(newData);
            };

            const updateTeamName = (division, teamId, newName) => {
                const newData = { ...tournamentData };
                const team = newData[division].teams.find(t => t.id === teamId);
                team.name = newName;
                setTournamentData(newData);
                publishData(newData);
            };

            const updatePlayerName = (division, teamId, playerIndex, newName) => {
                const newData = { ...tournamentData };
                const team = newData[division].teams.find(t => t.id === teamId);
                
                // Backwards compatibility: convert string to object if needed
                if (typeof team.players[playerIndex] === 'string') {
                    team.players[playerIndex] = { name: newName, checkedIn: false };
                } else {
                    team.players[playerIndex].name = newName;
                }
                
                setTournamentData(newData);
                publishData(newData);
            };

            const toggleCheckIn = (division, teamId, playerIndex) => {
                const newData = { ...tournamentData };
                const team = newData[division].teams.find(t => t.id === teamId);
                
                // Backwards compatibility: convert string to object if needed
                if (typeof team.players[playerIndex] === 'string') {
                    team.players[playerIndex] = { name: team.players[playerIndex], checkedIn: true };
                } else {
                    team.players[playerIndex].checkedIn = !team.players[playerIndex].checkedIn;
                }
                
                setTournamentData(newData);
                publishData(newData);
            };

            const handleLogin = () => {
                if (passwordInput === DIRECTOR_PASSWORD) {
                    setIsDirector(true);
                    setShowPasswordModal(false);
                    setPasswordInput('');
                } else {
                    alert('Incorrect password');
                }
            };

            const getTeamName = (division, teamId) => {
                const team = tournamentData[division].teams.find(t => t.id === teamId);
                return team ? team.name : 'Unknown Team';
            };

            const getTeamPlayers = (division, teamId) => {
                const team = tournamentData[division].teams.find(t => t.id === teamId);
                return team ? team.players : [];
            };

            const matchupExists = (division, roundId, team1Id, team2Id) => {
                const round = tournamentData[division].rounds.find(r => r.id === roundId);
                if (!round) return false;
                
                return round.matchups.some(matchup => 
                    (matchup.team1 === team1Id && matchup.team2 === team2Id) ||
                    (matchup.team1 === team2Id && matchup.team2 === team1Id)
                );
            };

            const getTeamsInIncompleteMatchups = (division, roundId) => {
                const round = tournamentData[division].rounds.find(r => r.id === roundId);
                if (!round) return [];
                
                const busyTeams = new Set();
                round.matchups.forEach(matchup => {
                    if (!matchup.allPairsComplete) {
                        busyTeams.add(matchup.team1);
                        busyTeams.add(matchup.team2);
                    }
                });
                return Array.from(busyTeams);
            };

            const isTeamAvailable = (division, roundId, teamId) => {
                const busyTeams = getTeamsInIncompleteMatchups(division, roundId);
                return !busyTeams.includes(teamId);
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-gray-800 via-gray-700 to-gray-900 flex items-center justify-center">
                        <div className="text-yellow-400 text-2xl font-bold">🔥 Connecting to real-time updates...</div>
                    </div>
                );
            }

            const currentDivision = tournamentData[activeTab];
            const sortedTeams = [...currentDivision.teams].sort((a, b) => b.points - a.points);

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-800 via-gray-700 to-gray-900 text-white p-4">
                    <div className="max-w-7xl mx-auto">
                        {/* Header */}
                        <div className="text-center mb-8">
                            <h1 className="text-5xl font-bold text-yellow-400 mb-2">🎾 The G Cup Championship</h1>
                            <p className="text-gray-300 text-xl">Laver Cup Style Doubles Tournament</p>
                            <div className="mt-4 flex justify-center gap-4">
                                {!isDirector ? (
                                    <button onClick={() => setShowPasswordModal(true)} className="px-6 py-3 bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold rounded-lg">
                                        Director Login
                                    </button>
                                ) : (
                                    <>
                                        <button onClick={() => setShowTeamManagement(true)} className="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg">
                                            Manage Teams
                                        </button>
                                        <button onClick={() => setShowCheckIn(true)} className="px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg">
                                            ✓ Check-In
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>

                        {/* Division Tabs */}
                        <div className="flex gap-2 mb-6">
                            <button
                                onClick={() => setActiveTab('championship')}
                                className={`flex-1 px-6 py-3 rounded-lg font-bold ${activeTab === 'championship' ? 'bg-yellow-500 text-gray-900' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`}
                            >
                                Championship Cup (4 Teams)
                            </button>
                            <button
                                onClick={() => setActiveTab('classic')}
                                className={`flex-1 px-6 py-3 rounded-lg font-bold ${activeTab === 'classic' ? 'bg-yellow-500 text-gray-900' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`}
                            >
                                Classic Cup (2 Teams)
                            </button>
                        </div>

                        {/* Password Modal */}
                        {showPasswordModal && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                                <div className="bg-gray-800 p-8 rounded-lg shadow-2xl">
                                    <h2 className="text-2xl font-bold text-yellow-400 mb-4">Director Login</h2>
                                    <input
                                        type="password"
                                        value={passwordInput}
                                        onChange={(e) => setPasswordInput(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                                        placeholder="Enter password"
                                        className="w-full px-4 py-2 bg-gray-700 text-white rounded mb-4"
                                    />
                                    <div className="flex gap-2">
                                        <button onClick={handleLogin} className="flex-1 px-4 py-2 bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold rounded">
                                            Login
                                        </button>
                                        <button onClick={() => { setShowPasswordModal(false); setPasswordInput(''); }} className="flex-1 px-4 py-2 bg-gray-600 hover:bg-gray-500 text-white font-bold rounded">
                                            Cancel
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Team Management Modal */}
                        {showTeamManagement && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 overflow-y-auto">
                                <div className="bg-gray-800 p-8 rounded-lg shadow-2xl max-w-4xl w-full m-4 max-h-[90vh] overflow-y-auto">
                                    <h2 className="text-3xl font-bold text-yellow-400 mb-6">Team Management</h2>
                                    
                                    <div className="mb-4">
                                        <select value={editingDivision} onChange={(e) => setEditingDivision(e.target.value)} className="px-4 py-2 bg-gray-700 text-yellow-200 rounded">
                                            <option value="championship">Championship Cup</option>
                                            <option value="classic">Classic Cup</option>
                                        </select>
                                    </div>

                                    <div className="space-y-6">
                                        {tournamentData[editingDivision].teams.map(team => (
                                            <div key={team.id} className="bg-gray-700 p-4 rounded-lg">
                                                <input
                                                    type="text"
                                                    value={team.name}
                                                    onChange={(e) => updateTeamName(editingDivision, team.id, e.target.value)}
                                                    className="text-xl font-bold bg-gray-600 text-yellow-400 px-3 py-2 rounded mb-3 w-full"
                                                />
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                    {team.players.map((player, idx) => {
                                                        const playerName = typeof player === 'string' ? player : player.name;
                                                        return (
                                                            <input
                                                                key={idx}
                                                                type="text"
                                                                value={playerName}
                                                                onChange={(e) => updatePlayerName(editingDivision, team.id, idx, e.target.value)}
                                                                className="px-3 py-2 bg-gray-600 text-white rounded"
                                                                placeholder={`Player ${idx + 1}`}
                                                            />
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <button onClick={() => setShowTeamManagement(false)} className="mt-6 w-full px-4 py-2 bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold rounded">
                                        Close
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Check-In Modal */}
                        {showCheckIn && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 overflow-y-auto">
                                <div className="bg-gray-800 p-8 rounded-lg shadow-2xl max-w-4xl w-full m-4 max-h-[90vh] overflow-y-auto">
                                    <h2 className="text-3xl font-bold text-yellow-400 mb-6">Player Check-In</h2>
                                    
                                    <div className="mb-4">
                                        <select value={editingDivision} onChange={(e) => setEditingDivision(e.target.value)} className="px-4 py-2 bg-gray-700 text-yellow-200 rounded">
                                            <option value="championship">Championship Cup</option>
                                            <option value="classic">Classic Cup</option>
                                        </select>
                                    </div>

                                    <div className="space-y-6">
                                        {tournamentData[editingDivision].teams.map(team => {
                                            const checkedInCount = team.players.filter(p => typeof p === 'object' && p.checkedIn).length;
                                            return (
                                                <div key={team.id} className="bg-gray-700 p-4 rounded-lg">
                                                    <h3 className="text-xl font-bold text-yellow-400 mb-2">{team.name}</h3>
                                                    <p className="text-sm text-gray-400 mb-3">Checked in: {checkedInCount} / {team.players.length}</p>
                                                    <div className="space-y-2">
                                                        {team.players.map((player, idx) => {
                                                            const playerName = typeof player === 'string' ? player : player.name;
                                                            const isCheckedIn = typeof player === 'object' ? player.checkedIn : false;
                                                            return (
                                                                <label key={idx} className="flex items-center gap-3 cursor-pointer hover:bg-gray-600 p-2 rounded">
                                                                    <input
                                                                        type="checkbox"
                                                                        checked={isCheckedIn}
                                                                        onChange={() => toggleCheckIn(editingDivision, team.id, idx)}
                                                                        className="w-5 h-5"
                                                                    />
                                                                    <span className={isCheckedIn ? 'text-green-400' : 'text-white'}>
                                                                        {playerName} {isCheckedIn && '✓'}
                                                                    </span>
                                                                </label>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <button onClick={() => setShowCheckIn(false)} className="mt-6 w-full px-4 py-2 bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold rounded">
                                        Close
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Standings */}
                        <div className="bg-gradient-to-br from-gray-900 to-gray-800 rounded-lg shadow-2xl p-6 mb-6 border-2 border-yellow-500">
                            <h2 className="text-2xl font-bold text-yellow-400 mb-4">Standings</h2>
                            <div className="space-y-3">
                                {sortedTeams.map((team, index) => (
                                    <div key={team.id} className={`p-4 rounded-lg ${index === 0 ? 'bg-gradient-to-r from-yellow-600 to-yellow-500 border-2 border-yellow-400' : 'bg-gray-800 border-2 border-gray-600'}`}>
                                        <div className="flex items-center justify-between">
                                            <div className="flex items-center gap-4">
                                                <span className={`text-2xl font-bold ${index === 0 ? 'text-gray-900' : 'text-yellow-400'}`}>#{index + 1}</span>
                                                <div>
                                                    <h3 className={`text-xl font-bold ${index === 0 ? 'text-gray-900' : 'text-yellow-200'}`}>{team.name}</h3>
                                                    <p className={`text-sm ${index === 0 ? 'text-gray-800' : 'text-gray-400'}`}>
                                                        {team.players.map((p, i) => {
                                                            const playerName = typeof p === 'string' ? p : p.name;
                                                            const isCheckedIn = typeof p === 'object' ? p.checkedIn : false;
                                                            return (
                                                                <span key={i}>
                                                                    {playerName}
                                                                    {isCheckedIn && <span className="text-green-500">✓</span>}
                                                                    {i < team.players.length - 1 ? ', ' : ''}
                                                                </span>
                                                            );
                                                        })}
                                                    </p>
                                                </div>
                                            </div>
                                            <div className={`text-3xl font-bold ${index === 0 ? 'text-gray-900' : 'text-yellow-400'}`}>{team.points} pts</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Rounds */}
                        {currentDivision.rounds.map(round => {
                            // Count total pairs across all matchups
                            const allPairs = round.matchups.flatMap(m => m.pairs);
                            const completedPairs = allPairs.filter(p => p.completed).length;
                            const inProgressPairs = allPairs.filter(p => !p.completed && (p.team1Games > 0 || p.team2Games > 0)).length;
                            const notStartedPairs = allPairs.filter(p => !p.completed && p.team1Games === 0 && p.team2Games === 0).length;
                            const remainingPairs = allPairs.filter(p => !p.completed).length;
                            
                            // Also track completed matchups for hide/show button
                            const completedMatchups = round.matchups.filter(m => m.allPairsComplete).length;
                            
                            return (
                                <div key={round.id} className="bg-gradient-to-br from-gray-900 to-gray-800 rounded-lg shadow-2xl p-6 mb-6 border-2 border-yellow-500">
                                    <div className="flex items-center justify-between mb-4">
                                        <div>
                                            <div className="flex items-center gap-3">
                                                <h2 className="text-2xl font-bold text-yellow-400">{round.name}</h2>
                                                {isDirector && round.matchups.length > 0 && (
                                                    <span className="text-lg font-semibold text-yellow-300">
                                                        ({completedPairs}/6 pairs complete)
                                                    </span>
                                                )}
                                            </div>
                                            <p className="text-yellow-200">Point Value: {round.pointValue} {round.pointValue === 1 ? 'point' : 'points'}</p>
                                            {isDirector && round.matchups.length > 0 && completedMatchups > 0 && (
                                                <div className="mt-2">
                                                    <button
                                                        onClick={() => setHideCompletedMatchups(prev => ({ ...prev, [round.id]: !prev[round.id] }))}
                                                        className="text-xs px-2 py-1 rounded bg-gray-700 hover:bg-gray-600 text-gray-300 border border-gray-500"
                                                    >
                                                        {hideCompletedMatchups[round.id] ? '👁️ Show' : '🙈 Hide'} Completed
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                        {isDirector && (
                                            <select onChange={(e) => {
                                                const teams = e.target.value.split('-');
                                                if (teams.length === 2) addTeamMatchup(activeTab, round.id, parseInt(teams[0]), parseInt(teams[1]));
                                            }} className="px-4 py-2 border-2 border-yellow-500 bg-gray-800 text-yellow-200 rounded-lg font-semibold" value="">
                                                <option value="">+ Add Team Matchup</option>
                                                {currentDivision.teams
                                                    .filter(team1 => isTeamAvailable(activeTab, round.id, team1.id))
                                                    .map(team1 =>
                                                        currentDivision.teams
                                                            .filter(team2 => 
                                                                team2.id !== team1.id && 
                                                                isTeamAvailable(activeTab, round.id, team2.id) &&
                                                                !matchupExists(activeTab, round.id, team1.id, team2.id)
                                                            )
                                                            .map(team2 => (
                                                                <option key={`${team1.id}-${team2.id}`} value={`${team1.id}-${team2.id}`}>{team1.name} vs {team2.name}</option>
                                                            ))
                                                    )}
                                            </select>
                                        )}
                                    </div>

                                    {/* Team Filter Dropdown - for non-directors to filter by their team */}
                                    {round.matchups.length > 0 && (
                                        <div className="mb-4">
                                            <label className="text-yellow-400 text-sm font-semibold mr-2">View Team:</label>
                                            <select 
                                                value={teamFilter[round.id] || 'all'}
                                                onChange={(e) => setTeamFilter(prev => ({ ...prev, [round.id]: e.target.value }))}
                                                className="px-3 py-2 border-2 border-yellow-500 bg-gray-800 text-yellow-200 rounded-lg font-semibold"
                                            >
                                                <option value="all">All Teams</option>
                                                {currentDivision.teams.map(team => (
                                                    <option key={team.id} value={team.id}>{team.name}</option>
                                                ))}
                                            </select>
                                        </div>
                                    )}
                                    
                                    <div className="space-y-6">
                                        {round.matchups.length === 0 ? (
                                            <p className="text-gray-400 text-center py-8">No matchups scheduled</p>
                                        ) : (
                                            [...round.matchups]
                                                .sort((a, b) => {
                                                    const aStatus = a.allPairsComplete ? 2 : (a.pairs.some(l => l.team1Games > 0 || l.team2Games > 0) ? 0 : 1);
                                                    const bStatus = b.allPairsComplete ? 2 : (b.pairs.some(l => l.team1Games > 0 || l.team2Games > 0) ? 0 : 1);
                                                    return aStatus - bStatus;
                                                })
                                                .filter(matchup => {
                                                    // Filter by hide completed
                                                    if (hideCompletedMatchups[round.id] && matchup.allPairsComplete) {
                                                        return false;
                                                    }
                                                    // Filter by selected team
                                                    const selectedTeam = teamFilter[round.id];
                                                    if (selectedTeam && selectedTeam !== 'all') {
                                                        const teamId = parseInt(selectedTeam);
                                                        if (matchup.team1 !== teamId && matchup.team2 !== teamId) {
                                                            return false;
                                                        }
                                                    }
                                                    return true;
                                                })
                                                .map(matchup => {
                                                    const isInProgress = !matchup.allPairsComplete && matchup.pairs.some(l => l.team1Games > 0 || l.team2Games > 0);
                                                    const isNotStarted = !matchup.allPairsComplete && matchup.pairs.every(l => l.team1Games === 0 && l.team2Games === 0);
                                                    const borderColor = matchup.allPairsComplete ? 'border-green-500' : isInProgress ? 'border-orange-500' : 'border-gray-600';
                                                    const completedPairs = matchup.pairs.filter(l => l.completed).length;
                                                    
                                                    // Count wins for each team
                                                    let team1Wins = 0;
                                                    let team2Wins = 0;
                                                    matchup.pairs.forEach(l => {
                                                        if (l.completed) {
                                                            if (l.team1Games > l.team2Games) team1Wins++;
                                                            else if (l.team2Games > l.team1Games) team2Wins++;
                                                        }
                                                    });
                                                    
                                                    return (
                                                        <div key={matchup.id} className={`border-2 rounded-lg p-4 bg-gray-800 ${borderColor}`}>
                                                            {/* Matchup Header */}
                                                            <div className="flex items-center justify-between mb-4 pb-4 border-b-2 border-gray-700">
                                                                <div>
                                                                    <h3 className="text-2xl font-bold text-yellow-400">
                                                                        {getTeamName(activeTab, matchup.team1)} vs {getTeamName(activeTab, matchup.team2)}
                                                                    </h3>
                                                                    <div className="flex gap-4 mt-2">
                                                                        {isDirector && isInProgress && (
                                                                            <span className="inline-block px-3 py-1 bg-orange-600 text-white text-xs font-bold rounded">
                                                                                🎾 IN PROGRESS
                                                                            </span>
                                                                        )}
                                                                        {completedPairs > 0 && (
                                                                            <span className="text-sm font-bold text-yellow-400">
                                                                                Score: {team1Wins} - {team2Wins}{isDirector && ` (${completedPairs}/3 pairs)`}
                                                                            </span>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                                {isDirector && (
                                                                    <button
                                                                        onClick={() => deleteMatchup(activeTab, round.id, matchup.id)}
                                                                        className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded"
                                                                    >
                                                                        Delete
                                                                    </button>
                                                                )}
                                                            </div>

                                                            {/* Pairs */}
                                                            <div className="space-y-4">
                                                                {matchup.pairs.map((pair, pairIdx) => {
                                                                    const hasScore = pair.team1Games > 0 || pair.team2Games > 0;
                                                                    
                                                                    return (
                                                                        <div key={pair.pairNumber} className={`border-2 rounded-lg p-4 ${pair.completed ? 'bg-gray-700 border-green-500' : 'bg-gray-800 border-gray-600'}`}>
                                                                            
                                                                            <h4 className="text-lg font-bold text-yellow-300 mb-3">
                                                                                Pair {pair.pairNumber}
                                                                                {pair.completed && <span className="ml-2 text-green-400">✓</span>}
                                                                            </h4>
                                                                            
                                                                            {(hasScore || pair.completed) && (
                                                                                <div className="text-center mb-4 pb-4 border-b-2 border-gray-600">
                                                                                    <p className="text-5xl font-bold text-yellow-400">{pair.team1Games} - {pair.team2Games}</p>
                                                                                    {pair.tiebreakScore && <p className="text-xl font-semibold text-red-400 mt-2">TB: {pair.tiebreakScore}</p>}
                                                                                </div>
                                                                            )}
                                                                            
                                                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                                                {/* Team 1 */}
                                                                                <div>
                                                                                    <h5 className="font-bold text-lg text-yellow-400 mb-2">{getTeamName(activeTab, matchup.team1)}</h5>
                                                                                    {isDirector && !pair.completed ? (
                                                                                        <div className="space-y-2 mb-2">
                                                                                            <select 
                                                                                                value={pair.team1Player1} 
                                                                                                onChange={(e) => updatePair(activeTab, round.id, matchup.id, pair.pairNumber, { team1Player1: e.target.value })}
                                                                                                className="w-full px-3 py-2 border rounded bg-gray-700 text-yellow-200">
                                                                                                <option value="">Select Player 1</option>
                                                                                                {getTeamPlayers(activeTab, matchup.team1).map((p, i) => {
                                                                                                    const playerName = typeof p === 'string' ? p : p.name;
                                                                                                    const isCheckedIn = typeof p === 'object' ? p.checkedIn : false;
                                                                                                    return <option key={i} value={playerName}>{playerName}{isCheckedIn && ' ✓'}</option>;
                                                                                                })}
                                                                                            </select>
                                                                                            <select 
                                                                                                value={pair.team1Player2} 
                                                                                                onChange={(e) => updatePair(activeTab, round.id, matchup.id, pair.pairNumber, { team1Player2: e.target.value })}
                                                                                                
                                                                                                className="w-full px-3 py-2 border rounded bg-gray-700 text-yellow-200">
                                                                                                <option value="">Select Player 2</option>
                                                                                                {getTeamPlayers(activeTab, matchup.team1).map((p, i) => {
                                                                                                    const playerName = typeof p === 'string' ? p : p.name;
                                                                                                    const isCheckedIn = typeof p === 'object' ? p.checkedIn : false;
                                                                                                    return <option key={i} value={playerName}>{playerName}{isCheckedIn && ' ✓'}</option>;
                                                                                                })}
                                                                                            </select>
                                                                                        </div>
                                                                                    ) : (
                                                                                        <p className="text-yellow-200 mb-2">{pair.team1Player1} & {pair.team1Player2}</p>
                                                                                    )}
                                                                                    {isDirector && !pair.completed ? (
                                                                                        <input 
                                                                                            type="number" 
                                                                                            min="0" 
                                                                                            max="4" 
                                                                                            value={pair.team1Games} 
                                                                                            onChange={(e) => updatePair(activeTab, round.id, matchup.id, pair.pairNumber, { team1Games: parseInt(e.target.value) || 0 })}
                                                                                            className="w-24 px-3 py-2 border bg-gray-700 text-yellow-400 rounded text-center text-2xl font-bold" 
                                                                                        />
                                                                                    ) : (
                                                                                        <p className="text-4xl font-bold text-yellow-400">{pair.team1Games}</p>
                                                                                    )}
                                                                                </div>
                                                                                
                                                                                {/* Team 2 */}
                                                                                <div>
                                                                                    <h5 className="font-bold text-lg text-yellow-400 mb-2">{getTeamName(activeTab, matchup.team2)}</h5>
                                                                                    {isDirector && !pair.completed ? (
                                                                                        <div className="space-y-2 mb-2">
                                                                                            <select 
                                                                                                value={pair.team2Player1} 
                                                                                                onChange={(e) => updatePair(activeTab, round.id, matchup.id, pair.pairNumber, { team2Player1: e.target.value })}
                                                                                                
                                                                                                className="w-full px-3 py-2 border rounded bg-gray-700 text-yellow-200">
                                                                                                <option value="">Select Player 1</option>
                                                                                                {getTeamPlayers(activeTab, matchup.team2).map((p, i) => {
                                                                                                    const playerName = typeof p === 'string' ? p : p.name;
                                                                                                    const isCheckedIn = typeof p === 'object' ? p.checkedIn : false;
                                                                                                    return <option key={i} value={playerName}>{playerName}{isCheckedIn && ' ✓'}</option>;
                                                                                                })}
                                                                                            </select>
                                                                                            <select 
                                                                                                value={pair.team2Player2} 
                                                                                                onChange={(e) => updatePair(activeTab, round.id, matchup.id, pair.pairNumber, { team2Player2: e.target.value })}
                                                                                                
                                                                                                className="w-full px-3 py-2 border rounded bg-gray-700 text-yellow-200">
                                                                                                <option value="">Select Player 2</option>
                                                                                                {getTeamPlayers(activeTab, matchup.team2).map((p, i) => {
                                                                                                    const playerName = typeof p === 'string' ? p : p.name;
                                                                                                    const isCheckedIn = typeof p === 'object' ? p.checkedIn : false;
                                                                                                    return <option key={i} value={playerName}>{playerName}{isCheckedIn && ' ✓'}</option>;
                                                                                                })}
                                                                                            </select>
                                                                                        </div>
                                                                                    ) : (
                                                                                        <p className="text-yellow-200 mb-2">{pair.team2Player1} & {pair.team2Player2}</p>
                                                                                    )}
                                                                                    {isDirector && !pair.completed ? (
                                                                                        <input 
                                                                                            type="number" 
                                                                                            min="0" 
                                                                                            max="4" 
                                                                                            value={pair.team2Games} 
                                                                                            onChange={(e) => updatePair(activeTab, round.id, matchup.id, pair.pairNumber, { team2Games: parseInt(e.target.value) || 0 })}
                                                                                            className="w-24 px-3 py-2 border bg-gray-700 text-yellow-400 rounded text-center text-2xl font-bold" 
                                                                                        />
                                                                                    ) : (
                                                                                        <p className="text-4xl font-bold text-yellow-400">{pair.team2Games}</p>
                                                                                    )}
                                                                                </div>
                                                                            </div>
                                                                            
                                                                            {/* Tiebreak */}
                                                                            {isDirector && !pair.completed && pair.team1Games === 3 && pair.team2Games === 3 && (
                                                                                <div className="mt-3">
                                                                                    <label className="block text-yellow-400 text-sm font-bold mb-2">Tiebreak Score (Required)</label>
                                                                                    <input
                                                                                        type="text"
                                                                                        value={pair.tiebreakScore}
                                                                                        onChange={(e) => updatePair(activeTab, round.id, matchup.id, pair.pairNumber, { tiebreakScore: e.target.value })}
                                                                                        placeholder="e.g., 7-5 or 5-7"
                                                                                        className="px-3 py-2 border bg-gray-700 text-yellow-200 rounded w-32"
                                                                                    />
                                                                                </div>
                                                                            )}
                                                                            
                                                                            {/* Complete/Edit Pair Buttons */}
                                                                            {isDirector && (
                                                                                <div className="mt-3 flex gap-2">
                                                                                    {!pair.completed && (pair.team1Games > 0 || pair.team2Games > 0) && (
                                                                                        <button
                                                                                            onClick={() => completePair(activeTab, round.id, matchup.id, pair.pairNumber)}
                                                                                            className="flex-1 px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-bold rounded"
                                                                                        >
                                                                                            Complete Pair {pair.pairNumber}
                                                                                        </button>
                                                                                    )}
                                                                                    {pair.completed && (
                                                                                        <button
                                                                                            onClick={() => uncomplatePair(activeTab, round.id, matchup.id, pair.pairNumber)}
                                                                                            className="flex-1 px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white font-bold rounded"
                                                                                        >
                                                                                            ✏️ Edit Pair {pair.pairNumber}
                                                                                        </button>
                                                                                    )}
                                                                                </div>
                                                                            )}
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                    );
                                                })
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<TournamentApp />, document.getElementById('root'));
    </script>
</body>
</html>
